syntax = "proto3";

package authzen.access.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv3/options/annotations.proto";

option go_package = "github.com/authzen/access/v1;access";
option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_document) = {
  info: {
    title: "OpenID AuthZen Access Service"
    // summary: ""
    // description: ""
    // terms_of_service: ""
    contact: {
      name: "OpenID Foundation - AuthZEN Working Group"
      url: "https://openid.net/wg/authzen/"
      email: ""
    }
    license: {
      name: "Apache v2"
      url: "https://github.com/authzen/access/blob/main/LICENSE"
    }
    version: "1.0.0"
    // extensions: {}
  }

  servers: [
    {
      url: "{{.Scheme}}://{{.Host}}"
      description: "OpenID AuthZEN service"
    }
  ]

  tags: [
    {name: "authzen"},
    {name: "evaluation"},
    {name: "evaluations"},
    {name: "subject"},
    {name: "action"},
    {name: "resource"},
    {name: "properties"},
    {name: "context"},
    {name: "check"},
    {name: "search"}
  ]

  external_docs: {
    url: "https://openid.github.io/authzen/"
    description: "Authorization API 1.0"
  }

  // extensions: {}
};

service Access {
  // evaluation (https://openid.github.io/authzen/#name-access-evaluation-api)
  rpc Evaluation(EvaluationRequest) returns (EvaluationResponse) {
    option (google.api.http) = {
      post: "/access/v1/evaluation"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "authzen",
        "evaluation",
        "check"
      ]
      summary: "Access Evaluation API"
      description: "TBD"
      // external_docs: {}
      operation_id: "openid.authzen.access.v1.evaluation.post"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // evaluations (https://openid.github.io/authzen/#name-access-evaluations-api)
  rpc Evaluations(EvaluationsRequest) returns (EvaluationsResponse) {
    option (google.api.http) = {
      post: "/access/v1/evaluations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "authzen",
        "evaluations",
        "check"
      ]
      summary: "Access Evaluations API"
      description: "TBD."
      // external_docs: {}
      operation_id: "openid.authzen.access.v1.evaluations.post"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // subject search (https://openid.github.io/authzen/#name-subject-search-api)
  rpc SubjectSearch(SubjectSearchRequest) returns (SubjectSearchResponse) {
    option (google.api.http) = {
      post: "/access/v1/search/subject"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "authzen",
        "subject",
        "search"
      ]
      tags: "authzen"
      summary: "Subject Search API"
      description: "TBD."
      // external_docs: {}
      operation_id: "openid.authzen.access.v1.search.subject.post"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // resource search (https://openid.github.io/authzen/#name-resource-search-api)
  rpc ResourceSearch(ResourceSearchRequest) returns (ResourceSearchResponse) {
    option (google.api.http) = {
      post: "/access/v1/search/resource"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "authzen",
        "resource",
        "search"
      ]
      summary: "Resource Search API"
      description: "TBD."
      // external_docs: {}
      operation_id: "openid.authzen.access.v1.search.post"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }

  // action search (https://openid.github.io/authzen/#name-action-search-api)
  rpc ActionSearch(ActionSearchRequest) returns (ActionSearchResponse) {
    option (google.api.http) = {
      post: "/access/v1/search/action"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      tags: [
        "authzen",
        "action",
        "search"
      ]
      summary: "Action Search API"
      description: "TBD."
      // external_docs: {}
      operation_id: "openid.authzen.access.v1.search.action.post"
      deprecated: false
      // servers: {}
      // extensions: {}
    };
  }
}

// https://openid.github.io/authzen/#name-the-access-evaluation-api-r
message EvaluationRequest {
  Subject subject = 1 [
    json_name = "subject",
    (google.api.field_behavior) = REQUIRED,
    deprecated = false
  ];

  Action action = 2 [
    json_name = "action",
    (google.api.field_behavior) = REQUIRED,
    deprecated = false
  ];

  Resource resource = 3 [
    json_name = "resource",
    (google.api.field_behavior) = REQUIRED,
    deprecated = false
  ];

  optional google.protobuf.Struct context = 4 [
    json_name = "context",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-the-access-evaluation-api-re
message EvaluationResponse {
  bool decision = 1 [
    json_name = "decision",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];

  google.protobuf.Struct context = 2 [
    json_name = "context",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-the-access-evaluations-api-
message EvaluationsRequest {
  Subject subject = 1 [
    json_name = "subject",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  Action action = 2 [
    json_name = "action",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  Resource resource = 3 [
    json_name = "resource",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  optional google.protobuf.Struct context = 4 [
    json_name = "context",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  optional google.protobuf.Struct options = 5 [
    json_name = "options",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  repeated EvaluationRequest evaluations = 6 [
    json_name = "evaluations",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-access-evaluations-api-resp
message EvaluationsResponse {
  repeated EvaluationResponse evaluations = 1 [
    json_name = "evaluations",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-the-subject-search-api-requ
message SubjectSearchRequest {
  Subject subject = 1 [
    json_name = "subject",
    (google.api.field_behavior) = REQUIRED,
    deprecated = false
  ];

  Action action = 2 [
    json_name = "action",
    (google.api.field_behavior) = REQUIRED,
    deprecated = false
  ];

  Resource resource = 3 [
    json_name = "resource",
    (google.api.field_behavior) = REQUIRED,
    deprecated = false
  ];

  google.protobuf.Struct context = 4 [
    json_name = "context",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  PaginationRequest page = 10 [
    json_name = "page",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-the-subject-search-api-resp
message SubjectSearchResponse {
  repeated Subject results = 1 [
    json_name = "results",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];

  PaginationResponse page = 10 [
    json_name = "page",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];
}

