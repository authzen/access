// https://openid.github.io/authzen/#name-paginated-requests
message PaginationRequest {
  optional string token = 1 [
    json_name = "token",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  optional int32 limit = 2 [
    json_name = "limit",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  optional google.protobuf.Struct properties = 3 [
    json_name = "properties",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-paginated-responses
message PaginationResponse {
  string next_token = 1 [
    json_name = "next_token",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];

  optional int64 count = 2 [
    json_name = "count",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];

  optional int64 total = 3 [
    json_name = "total",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];

  optional google.protobuf.Struct properties = 4 [
    json_name = "properties",
    (google.api.field_behavior) = OUTPUT_ONLY,
    deprecated = false
  ];
}
