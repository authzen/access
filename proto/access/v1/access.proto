// https://openid.github.io/authzen/#name-subject
message Subject {
  string type = 1 [
    json_name = "type",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  string id = 2 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  optional google.protobuf.Struct properties = 3 [
    json_name = "properties",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-action
message Action {
  string name = 1 [
    json_name = "name",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  optional google.protobuf.Struct properties = 2 [
    json_name = "properties",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];
}

// https://openid.github.io/authzen/#name-resource
message Resource {
  string type = 1 [
    json_name = "type",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
  ];

  string id = 2 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    deprecated = false
